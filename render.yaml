# Render Blueprint for the game server: New > Blueprint, then pick this repository.
# Rooms live in memory, so keep a single instance (see README, "Scaling").
services:
  - type: web
    name: wreckyard-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    numInstances: 1
    autoDeploy: true
    envVars:
      # Your Vercel domain(s), comma separated, e.g. https://wreckyard.vercel.app
      # Add https://*.vercel.app only if preview deployments should reach this server.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: MAX_ROOMS
        value: '50'
      - key: SNAPSHOT_HZ
        value: '20'
      - key: MAX_MSG_PER_SEC
        value: '120'
      - key: SHUTDOWN_GRACE_MS
        value: '5000'
