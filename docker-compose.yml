# Runs the production server image locally, for parity with the Render deployment.
# Pair it with `npm run dev` (proxied, http://localhost:5173) or a preview build.
services:
  server:
    build: .
    image: wreckyard-server
    ports:
      - '${WRECKYARD_SERVER_PORT:-8787}:8787'
    environment:
      WRECKYARD_ALLOWED_ORIGINS: ${WRECKYARD_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      WRECKYARD_LOG_LEVEL: ${WRECKYARD_LOG_LEVEL:-info}
      WRECKYARD_MAX_ROOMS: ${WRECKYARD_MAX_ROOMS:-50}
      WRECKYARD_SNAPSHOT_HZ: ${WRECKYARD_SNAPSHOT_HZ:-20}
      WRECKYARD_MAX_MSG_PER_SEC: ${WRECKYARD_MAX_MSG_PER_SEC:-120}
      WRECKYARD_SHUTDOWN_GRACE_MS: ${WRECKYARD_SHUTDOWN_GRACE_MS:-5000}
    stop_grace_period: 10s
